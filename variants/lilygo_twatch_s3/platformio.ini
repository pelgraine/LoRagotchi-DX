; LilyGo T-Watch S3 (16 MB flash, 8 MB PSRAM), SX1262 or SX1280 radio.
; Hardware layer (power, display, touch, PWR key, SX1280 radio) ported from the
; T-Watch edition of Meck. LoRaGotchi builds:
;   TWatch_S3_LoRaFish_companion_ble       SX1262, BLE companion, 80 MHz,
;                                          aquarium at ~30 frames a second
;   TWatch_S3_LoRaFish_standalone          SX1262, no Bluetooth, longer battery
;                                          life: 40 MHz after boot, display-off
;                                          throttle, aquarium at 10 frames a second
;   TWatch_S3_1280_LoRaFish_companion_ble  SX1280 (2.4 GHz), BLE companion, 80 MHz,
;                                          aquarium at ~30 frames a second

; Settings shared by every T-Watch S3 build.
[LilyGo_TWatch_S3_common]
extends = esp32_base
board = lilygo_twatch_s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_twatch_s3
  -D LILYGO_TWATCH_S3
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; No GPIO button on this board: the input comes from the PWR key (via the
  ; PMU) and the touch screen (TWatchInput.h). -1 only enables UITask's
  ; single-button input path; it is never used as a pin.
  -D PIN_USER_BTN=-1
  ; Directional tap/swipe navigation for the LoRaGotchi UI (only takes effect
  ; together with LORAFISH_UI; see UITask::handleWatchTouch).
  -D LORAFISH_WATCH_TOUCH
  ; Taller aquarium canvas so the tank fills the square screen (only takes
  ; effect together with LORAFISH_UI; see TWatchS3TankView).
  -D LORAFISH_TALL_TANK
  ; Colour tank scenery from the Cardputer build (water, light, reef, sand,
  ; seaweed, fish shading), drawn over the whole tall tank. Also raises the
  ; aquarium to ~30 frames a second unless LORAFISH_25D_10FPS is set.
  -D LORAFISH_CARDPUTER_25D
  ; The fish wanders around the tall tank (glides, hovers with bubbles,
  ; occasional darts) instead of patrolling wall to wall.
  -D LORAFISH_FISH_WANDER
  ; No GNSS receiver on the T-Watch S3: leave out the GNSS page and the
  ; "GNSS monitor" option. A position can still be set from the MeshCore app.
  -D LORAFISH_NO_GNSS_PAGE
  ; ---- LoRa pins (same on both radio revisions) ----
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=9
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=1
  ; ---- Display: ST7789V 240x240 + FT6336U touch via LovyanGFX ----
  -D DISPLAY_CLASS=TWatchS3Display
  ; ---- Power ----
  -D AUTO_SHUTDOWN_MILLIVOLTS=3100
  ; ---- No GPS or environment sensors ----
  -D ENV_INCLUDE_GPS=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_twatch_s3>
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.0
  lewisxhe/XPowersLib @ ^0.2.7

; ---- SX1262 (sub-GHz) watch ----
[LilyGo_TWatch_S3]
extends = LilyGo_TWatch_S3_common
build_flags =
  ${LilyGo_TWatch_S3_common.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D USE_SX1262
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1

; ---- SX1280 (2.4 GHz) watch ----
; Radio settings from Meck's T-Watch S3 SX1280 build. Boot defaults follow the
; Sydney 2.4 GHz plan (2400.5 MHz / 406.25 kHz / SF11 / CR8). No external RF
; switch pins: the radio module switches TX/RX internally. The CPU stays at
; 80 MHz or above: Meck found a 40 MHz clock trips the watchdog on SX1280 builds.
[LilyGo_TWatch_S3_SX1280]
extends = LilyGo_TWatch_S3_common
build_unflags =
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
build_flags =
  ${LilyGo_TWatch_S3_common.build_flags}
  -D TWATCH_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
  -D LORA_FREQ=2400.5
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=8
  -D LORA_TX_POWER=13
  -D MAX_LORA_TX_POWER=13

[env:TWatch_S3_LoRaFish_companion_ble]
extends = LilyGo_TWatch_S3
build_flags =
  ${LilyGo_TWatch_S3.build_flags}
  -I examples/companion_radio/ui-new
  -D LORAFISH_UI=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ESP32_CPU_FREQ=80
build_src_filter = ${LilyGo_TWatch_S3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3.lib_deps}
  densaugeo/base64 @ ~1.4.0

; No Bluetooth, so no phone app: the fish runs on the mesh traffic it hears.
; The clock comes from the watch's RTC chip, which keeps time across reboots
; and reflashing once it has been set (for example from the MeshCore app while
; running the BLE build).
[env:TWatch_S3_LoRaFish_standalone]
extends = LilyGo_TWatch_S3
build_flags =
  ${LilyGo_TWatch_S3.build_flags}
  -I examples/companion_radio/ui-new
  -D LORAFISH_UI=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=1
  ; Boot at 80 MHz (a first-boot filesystem format needs it), then drop to
  ; 40 MHz once boot has finished.
  -D ESP32_CPU_FREQ=80
  -D TWATCH_CPU_MHZ_AFTER_BOOT=40
  ; While the display is off, pause the main loop 50 ms per pass.
  -D TWATCH_DISPLAY_OFF_THROTTLE_MS=50
  ; Keep the aquarium at 10 frames a second (not the scenery's 30).
  -D LORAFISH_25D_10FPS
build_src_filter = ${LilyGo_TWatch_S3.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  ESP32 BLE Arduino

[env:TWatch_S3_1280_LoRaFish_companion_ble]
extends = LilyGo_TWatch_S3_SX1280
build_flags =
  ${LilyGo_TWatch_S3_SX1280.build_flags}
  -I examples/companion_radio/ui-new
  -D LORAFISH_UI=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ESP32_CPU_FREQ=80
build_src_filter = ${LilyGo_TWatch_S3_SX1280.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3_SX1280.lib_deps}
  densaugeo/base64 @ ~1.4.0
